name: Build installation release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Verify public tree
        run: python3 scripts/check_public_tree.py
      - name: Build ZIP and tar.gz packages
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          prefix="brohome-$version/"
          git archive --format=zip --prefix="$prefix" -o "brohome-$version.zip" HEAD
          git archive --format=tar.gz --prefix="$prefix" -o "brohome-$version.tar.gz" HEAD
          sha256sum "brohome-$version.zip" "brohome-$version.tar.gz" > "brohome-$version.sha256"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          brohome-*.zip
          brohome-*.tar.gz
          brohome-*.sha256
          --title "BroHome $GITHUB_REF_NAME"
          --generate-notes
